const LIVE_TTL=15*60000,DET_TTL=60*60000,NEXT_TTL=24*3600000;

async function refreshLive0(force){const t=tok();if(!t){if(force){S.liveMsg='Connect Trakt first (+ button) to refresh.';if(S.view==='list')render()}return}if(liveBusy)return;
 const L0=liveC();if(!force&&L0&&L0.t&&Date.now()-L0.t<LIVE_TTL)return;
 liveBusy=true;S.liveMsg=L0?'Updating from Trakt...':'Loading your shows from Trakt...';if(S.view==='list')render();
 const H={'trakt-api-version':'2','trakt-api-key':KEY,Authorization:'Bearer '+t};const HP={'trakt-api-version':'2','trakt-api-key':KEY};
 try{
  const now=Date.now(),DAY=864e5;
  const prev={};((L0&&L0.shows)||[]).forEach(x=>prev[x.id]=x);
  const full=force==='full'||!L0||now-(L0.t||0)>3*DAY;
  const cs=new Date(now-3*DAY).toISOString().slice(0,10);
  const [wr,lr,cr]=await Promise.all([fx('https://api.trakt.tv/sync/watched/shows?extended=noseasons,full',{headers:H}),fx('https://api.trakt.tv/sync/watchlist/shows?extended=full',{headers:H}),fx('https://api.trakt.tv/calendars/my/shows/'+cs+'/33',{headers:H})]);
  if(wr.status===401){ls.del('traktTok');throw new Error('login expired, reconnect with +')}
  if(!wr.ok)throw new Error('watched list HTTP '+wr.status);
  const watched=await wr.json();const wl=lr.ok?await lr.json():[];const cal=cr.ok?await cr.json():null;
  const calMap={};if(cal)cal.forEach(c=>{if(c.show&&c.show.ids&&c.first_aired)(calMap[c.show.ids.trakt]=calMap[c.show.ids.trakt]||[]).push(new Date(c.first_aired).getTime())});
  await fetchRemoteHidden(H);const RH=rhSet();
  const cand=new Map();
  watched.forEach(w=>{const sh=w.show;if(!sh||!sh.ids)return;const ended=sh.status==='ended'||sh.status==='canceled';const age=(now-new Date(w.last_watched_at).getTime())/DAY;
   if(!ended||age<=90)cand.set(sh.ids.trakt,{title:sh.title,id:sh.ids.trakt,imdb:sh.ids.imdb||'',tmdb:sh.ids.tmdb||0,status:sh.status||'',lw:w.last_watched_at||''})});
  wl.forEach(w=>{const sh=w.show;if(!sh||!sh.ids)return;const ended=sh.status==='ended'||sh.status==='canceled';if(!ended&&!cand.has(sh.ids.trakt))cand.set(sh.ids.trakt,{title:sh.title,id:sh.ids.trakt,imdb:sh.ids.imdb||'',tmdb:sh.ids.tmdb||0,status:sh.status||'',lw:''})});
  const items=[...cand.values()].filter(x=>!RH.has(x.id));let i=0,fail=0,calls=0;const out=[];
  async function w(){while(i<items.length){const it=items[i++];const p=prev[it.id];await sleep(120);
   try{const cl=calMap[it.id]||[];const fut=cl.filter(x=>x>now).sort((a,b)=>a-b)[0];
    const airedSince=!!(p&&cl.some(x=>x<=now&&x>(p.t||0)));
    const stale=full||!p||(it.lw&&new Date(it.lw).getTime()>(p.t||0))||airedSince||(p.next&&new Date(p.next).getTime()<=now);
    let unw=p?p.unw:0;
    if(stale){const pr=await fx('https://api.trakt.tv/shows/'+it.id+'/progress/watched',{headers:H});calls++;
     if(!pr.ok){fail++;if(p)out.push(p);continue}const pg=await pr.json();unw=Math.max(0,(pg.aired||0)-(pg.completed||0))}
    let next=p?p.next:null,nt=p?p.nt:0;
    if(fut){next=new Date(fut).toISOString();nt=now}
    else if(!p||now>(p.nt||0)+NEXT_TTL||(p.next&&new Date(p.next).getTime()<=now)||full){
     const nr=await fx('https://api.trakt.tv/shows/'+it.id+'/next_episode?extended=full',{headers:HP});calls++;next=null;
     if(nr.status===200){const ne=await nr.json();if(ne&&ne.first_aired&&new Date(ne.first_aired).getTime()>now)next=ne.first_aired}nt=now}
    const ended=it.status==='ended'||it.status==='canceled';
    if(ended&&unw===0)continue;
    out.push({title:it.title,id:it.id,imdb:it.imdb,tmdb:it.tmdb,status:it.status,unw,next,nt,lw:it.lw,t:stale?now:(p.t||now)})}catch(e){fail++;if(p)out.push(p)}}}
  await Promise.all([w(),w()]);
  if(out.length){ls.set('live',JSON.stringify({t:now,shows:out}));const P={};out.forEach(x=>P[x.title]=x.unw);ls.set('prog',JSON.stringify(P))}
  S.synced=new Date();S.syncFail=fail;S.syncCalls=calls;S.liveMsg=''}
 catch(e){S.liveMsg='Could not update from Trakt ('+(e.message||'error')+'). Showing the last saved list.'}
