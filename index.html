async function runSearch(q){const enc=encodeURIComponent(q);
 try{const [bt,pp]=await Promise.all([tj('/search/show?extended=full&limit=8&query='+enc),tj('/search/person?limit=2&query='+enc).catch(()=>[])]);
  const out=[],seen=new Set();const push=(sh,via)=>{if(!sh||!sh.ids||seen.has(sh.ids.trakt))return;seen.add(sh.ids.trakt);const o=sh.overview||'';out.push({id:sh.ids.trakt,title:sh.title,year:sh.year?''+sh.year:'',network:sh.network||'',status:sh.status||'',overview:o.length>200?o.slice(0,197).replace(/\s+\S*$/,'')+'...':o,via:via||''})};
  bt.forEach(x=>push(x.show));const p=pp&&pp[0]&&pp[0].person;
  if(p&&p.ids){try{const c=await tj('/people/'+p.ids.trakt+'/shows?extended=full');(c.cast||[]).filter(x=>x.show&&x.show.votes>500).sort((a,b)=>b.show.votes-a.show.votes).slice(0,8).forEach(x=>push(x.show,'with '+p.name))}catch(e){}}
  set({results:out,msg:out.length?'Tap + Add to put a show on your list.':'No shows found for "'+q+'".'})}
 catch(e){set({msg:'Could not reach Trakt ('+(e.message||'error')+').'})}}
async function addShow(r){set({adding:r.id});
 try{const data=await tj('/shows/'+r.id+'/seasons?extended=episodes,full');const now=Date.now();let unw=0;const eps=[];const top=Math.max(0,...data.filter(x=>x.number>0).map(x=>x.number));
  data.forEach(sn=>{if(sn.number===0)return;(sn.episodes||[]).forEach(e=>{const fa=e.first_aired;if(fa&&new Date(fa).getTime()<=now){unw++;return}if(!fa&&sn.number!==top)return;const ov=(e.overview||'').trim();let t=e.title||'';if(/^episode \d+$/i.test(t)||t==='TBA')t='';eps.push({s:sn.number,e:e.number,t,a:fa||null,o:ov.length>260?ov.slice(0,257).replace(/\s+\S*$/,'')+'...':ov})})});
  eps.sort((a,b)=>(a.a?0:1)-(b.a?0:1)||(a.a||'').localeCompare(b.a||'')||a.s-b.s||a.e-b.e);
  ls.set('hidden',JSON.stringify(hiddenL().filter(x=>x!==r.title.toLowerCase())));const l=added().filter(a=>a.id!==r.id);l.push({id:r.id,title:r.title,status:r.status,unw,eps:eps.slice(0,14)});saveAdded(l);
  const t=tok();let wmsg='';
  if(t){try{const w=await tpost('/sync/watchlist',{shows:[{ids:{trakt:r.id}}]},t);if(w.status===401){ls.del('traktTok')}if(w.status>=300){set({adding:null,view:'search',auth:'Added here, but Trakt watchlist failed (HTTP '+w.status+(w.status===401?', please reconnect':'')+').'});return}}catch(e){set({adding:null,view:'search',auth:'Added here, but Trakt watchlist failed ('+(e.message||'error')+').'});return}}
  set({adding:null,view:'list',auth:''});scrollTo(0,0)}
 catch(e){set({adding:null,msg:'Could not add that show ('+(e.message||'error')+').'})}}
async function connect(){try{set({pending:true,auth:'Contacting Trakt...'});const dc=await tpost('/oauth/device/code',{client_id:KEY});if(dc.status!==200)throw new Error('code request HTTP '+dc.status);const d=dc.body;
  const url=d.verification_url+'?code='+d.user_code;window.open(url,'_blank');
  set({auth:'A Trakt tab should have opened. If not, go to '+d.verification_url+' and enter code '+d.user_code+'. Waiting for approval...'});
  const stop=Date.now()+d.expires_in*1000;
  while(Date.now()<stop){await new Promise(r=>setTimeout(r,(d.interval||5)*1000));const t=await tpost('/oauth/device/token',{code:d.device_code,client_id:KEY});
   if(t.status===200&&t.body&&t.body.access_token){ls.set('traktTok',t.body.access_token);set({pending:false,auth:''});return}
   if(t.status===400||t.status===429)continue;throw new Error('sign-in HTTP '+t.status)}
  throw new Error('code expired')}catch(e){set({pending:false,auth:'Could not connect to Trakt ('+(e.message||'error')+').'})}}
const showId=t=>IDS[t]||(((liveC()||{}).shows||[]).find(a=>a.title===t)||{}).id||(added().find(a=>a.title===t)||{}).id;
async function loadDetail(t){const id=showId(t),tk=tok();if(!id)return;S.det[t]={loading:true};
 try{const H={'trakt-api-version':'2','trakt-api-key':KEY,Authorization:'Bearer '+tk};
  const [sr,pr]=await Promise.all([fetch('https://api.trakt.tv/shows/'+id+'/seasons?extended=episodes,full',{headers:{'trakt-api-version':'2','trakt-api-key':KEY}}),tk?fetch('https://api.trakt.tv/shows/'+id+'/progress/watched',{headers:H}):Promise.resolve(null)]);
  if(pr&&pr.status===401){ls.del('traktTok');throw new Error('Trakt login expired. Reconnect with the + button.')}
  if(!sr.ok||(pr&&!pr.ok))throw new Error((sr.ok?'Trakt progress check':'Trakt episode list')+' returned HTTP '+(sr.ok?pr.status:sr.status));
  const seasons=await sr.json(),pg=pr?await pr.json():{};const done=new Set();
  (pg.seasons||[]).forEach(sn=>(sn.episodes||[]).forEach(e=>{if(e.completed)done.add(sn.number+'x'+e.number)}));
  const now=Date.now(),unw=[],up=[];const top=Math.max(0,...seasons.filter(x=>x.number>0).map(x=>x.number));
  seasons.forEach(sn=>{if(sn.number===0)return;(sn.episodes||[]).forEach(e=>{let ti=e.title||'';if(/^episode \d+$/i.test(ti)||ti==='TBA')ti='';const o=(e.overview||'').trim();const od=o.length>260?o.slice(0,257).replace(/\s+\S*$/,'')+'...':o;
   if(e.first_aired&&new Date(e.first_aired).getTime()>now){up.push({s:sn.number,e:e.number,t:ti,a:e.first_aired,o:od});return}
   if(!e.first_aired){if(sn.number===top)up.push({s:sn.number,e:e.number,t:ti,a:null,o:od});return}
   if(done.has(sn.number+'x'+e.number))return;unw.push({id:e.ids.trakt,s:sn.number,e:e.number,t:ti,a:e.first_aired,o:od})})});
  up.sort((x,y)=>(x.a?0:1)-(y.a?0:1)||(x.a||'').localeCompare(y.a||'')||x.s-y.s||x.e-y.e);
  unw.sort((a,b)=>a.a.localeCompare(b.a));
  S.det[t]={unw,up:up.slice(0,14),hasProg:!!pr};if(pr){const P=prog();P[t]=unw.length;ls.set('prog',JSON.stringify(P))}}
 catch(e){S.det[t]={err:e.message||'Could not load from Trakt'}}
 if(S.view==='detail'&&S.sel===t)render()}
async function markEps(t,list){const D=S.det[t];if(!D||!list.length||D.busy)return;D.busy=true;D.msg='';render();
 try{const r=await tpost('/sync/history',{episodes:list.map(x=>({ids:{trakt:x.id},watched_at:'released'}))},tok());
  if(r.status===401){ls.del('traktTok');throw new Error('Trakt login expired. Reconnect with the + button.')}
  if(r.status>=300)throw new Error('Trakt returned HTTP '+r.status);
  const ok=new Set(list.map(x=>x.id));D.unw=D.unw.filter(x=>!ok.has(x.id));D.msg='Marked '+((r.body&&r.body.added&&r.body.added.episodes)||list.length)+' episode'+(list.length===1?'':'s')+' as watched on Trakt.';
  const P=prog();P[t]=D.unw.length;ls.set('prog',JSON.stringify(P))}
 catch(e){D.msg='Could not mark as watched ('+(e.message||'error')+').'}
 D.busy=false;render()}
async function removeShow(t){
 if(S.confirmRm!==t){set({confirmRm:t,rmMsg:''});return}
 const id=showId(t),tk=tok();
 if(tk&&id){try{const r=await tpost('/sync/watchlist/remove',{shows:[{ids:{trakt:id}}]},tk);
   if(r.status===401){ls.del('traktTok')}
   if(r.status>=300){set({confirmRm:null,rmMsg:'Could not remove it on Trakt (HTTP '+r.status+(r.status===401?', please reconnect':'')+'). Nothing was changed.'});return}}
  catch(e){set({confirmRm:null,rmMsg:'Could not reach Trakt ('+(e.message||'error')+'). Nothing was changed.'});return}}
 const h=hiddenL();if(!h.includes(t.toLowerCase()))h.push(t.toLowerCase());ls.set('hidden',JSON.stringify(h));
 saveAdded(added().filter(a=>a.title!==t));
 const L=liveC();if(L&&L.shows){L.shows=L.shows.filter(x=>x.title!==t);ls.set('live',JSON.stringify(L))}
 set({view:'list',sel:null,confirmRm:null,rmMsg:''});scrollTo(0,0)}
let liveBusy=false,liveAt=0;
async function refreshLive(force){const t=tok();if(!t||liveBusy||(!force&&Date.now()-liveAt<60000))return;liveBusy=true;liveAt=Date.now();S.liveMsg='Loading your shows from Trakt...';if(S.view==='list')render();
 const H={'trakt-api-version':'2','trakt-api-key':KEY,Authorization:'Bearer '+t};const HP={'trakt-api-version':'2','trakt-api-key':KEY};
 try{
  const [wr,lr]=await Promise.all([fetch('https://api.trakt.tv/sync/watched/shows?extended=noseasons,full',{headers:H}),fetch('https://api.trakt.tv/sync/watchlist/shows?extended=full',{headers:H})]);
  if(wr.status===401){ls.del('traktTok');throw new Error('login expired, reconnect with +')}
  if(!wr.ok)throw new Error('watched list HTTP '+wr.status);
  const watched=await wr.json();const wl=lr.ok?await lr.json():[];
  const cand=new Map();const now=Date.now(),DAY=864e5;
  watched.forEach(w=>{const sh=w.show;if(!sh||!sh.ids)return;const ended=sh.status==='ended'||sh.status==='canceled';const age=(now-new Date(w.last_watched_at).getTime())/DAY;
   if(!ended||age<=90)cand.set(sh.ids.trakt,{title:sh.title,id:sh.ids.trakt,status:sh.status||''})});
  wl.forEach(w=>{const sh=w.show;if(!sh||!sh.ids)return;const ended=sh.status==='ended'||sh.status==='canceled';if(!ended&&!cand.has(sh.ids.trakt))cand.set(sh.ids.trakt,{title:sh.title,id:sh.ids.trakt,status:sh.status||''})});
  const items=[...cand.values()];let i=0,fail=0;const out=[];
  async function w(){while(i<items.length){const it=items[i++];
   try{const [pr,nr]=await Promise.all([fetch('https://api.trakt.tv/shows/'+it.id+'/progress/watched',{headers:H}),fetch('https://api.trakt.tv/shows/'+it.id+'/next_episode?extended=full',{headers:HP})]);
    if(!pr.ok){fail++;continue}const pg=await pr.json();const unw=Math.max(0,(pg.aired||0)-(pg.completed||0));let next=null;
    if(nr.status===200){const ne=await nr.json();if(ne&&ne.first_aired&&new Date(ne.first_aired).getTime()>now)next=ne.first_aired}
    const ended=it.status==='ended'||it.status==='canceled';
    if(ended&&unw===0)continue;
    out.push({title:it.title,id:it.id,status:it.status,unw,next})}catch(e){fail++}}}
  await Promise.all([w(),w(),w(),w(),w(),w()]);
  if(out.length){ls.set('live',JSON.stringify({t:Date.now(),shows:out}));const P={};out.forEach(x=>P[x.title]=x.unw);ls.set('prog',JSON.stringify(P))}
  S.synced=new Date();S.syncFail=fail;S.liveMsg=''}
 catch(e){S.liveMsg='Could not load your shows from Trakt ('+(e.message||'error')+'). Showing the last saved list.'}
 liveBusy=false;if(S.view==='list')render()}
let refreshing=false;
async function refreshProgress(){const t=tok();if(!t||refreshing)return;refreshing=true;
 const A=allShows();const items=A.list.map(x=>x[0]).map(n=>({n,id:IDS[n]||(A.a.find(a=>a.title===n)||{}).id})).filter(x=>x.id);
 const P=prog();let i=0,fail=0;
 async function w(){while(i<items.length){const it=items[i++];
  try{const r=await fetch('https://api.trakt.tv/shows/'+it.id+'/progress/watched',{headers:{'trakt-api-version':'2','trakt-api-key':KEY,Authorization:'Bearer '+t}});
   if(r.status===401){ls.del('traktTok');i=items.length;return}
   if(!r.ok){fail++;continue}const j=await r.json();P[it.n]=Math.max(0,(j.aired||0)-(j.completed||0))}catch(e){fail++}}}
 await Promise.all([w(),w(),w(),w(),w(),w()]);
 ls.set('prog',JSON.stringify(P));refreshing=false;S.synced=new Date();S.syncFail=fail;if(S.view==='list')render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.open){set({view:'detail',sel:b.dataset.open,confirmRm:null,rmMsg:''});scrollTo(0,0);loadDetail(b.dataset.open)}
 else if(b.dataset.mark){const D=S.det[S.sel];if(D&&D.unw)markEps(S.sel,D.unw.filter(x=>String(x.id)===b.dataset.mark))}
 else if(b.dataset.act==='markall'){const D=S.det[S.sel];if(D&&D.unw)markEps(S.sel,D.unw.slice())}
 else if(b.dataset.add!=null){addShow(S.results[+b.dataset.add])}
 else if(b.dataset.act==='back'){set({view:'list',sel:null});scrollTo(0,0)}
 else if(b.dataset.act==='search'){set({view:'search',results:[],msg:'Search Trakt by show title or actor name.'});scrollTo(0,0)}
 else if(b.dataset.act==='remove'){removeShow(S.sel)}
 else if(b.dataset.act==='connect'){connect()}
 else if(b.dataset.act==='disconnect'){ls.del('traktTok');set({auth:''})}});
document.addEventListener('submit',e=>{if(e.target.id!=='sf')return;e.preventDefault();const q=e.target.elements.q.value.trim();if(!q)return;set({msg:'Searching...',results:[]});runSearch(q)});
render();
refreshLive(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshLive()});
</script></body></html>
